name: Final Dual-Memory Study Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dual-memory-final-study
    paths:
      - "src/memorydna/dual_memory.py"
      - "src/memorydna/final_study.py"
      - "run_final_study.py"
      - "tests/test_dual_memory.py"
      - "docs/FINAL_STUDY.md"
      - ".github/workflows/final-study-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run complete test suite
        run: pytest -q

      - name: Run final-study smoke
        run: python run_final_study.py --preset smoke --seed 7 --output results/final-study-smoke

      - name: Audit outputs
        run: |
          test -s results/final-study-smoke/architecture_summary.csv
          test -s results/final-study-smoke/paired_effects.csv
          test -s results/final-study-smoke/pattern_summary.csv
          test -s results/final-study-smoke/regime_history.csv
          test -s results/final-study-smoke/metadata.json
          test -s results/final-study-smoke/FINAL_RESULTS.md
          cat results/final-study-smoke/FINAL_RESULTS.md

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-dual-memory-smoke-seed7
          path: results/final-study-smoke
          retention-days: 30
