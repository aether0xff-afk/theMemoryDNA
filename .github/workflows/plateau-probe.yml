name: r_germ Plateau Probe

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Random seed"
        required: true
        default: "7"
  push:
    branches: [main]
    paths:
      - "src/memorydna/model.py"
      - "src/memorydna/ga.py"
      - "src/memorydna/environment.py"
      - "src/memorydna/plateau_probe.py"
      - "run_plateau_probe.py"
      - "tests/test_model.py"
      - "tests/test_plateau_probe.py"
      - ".github/workflows/plateau-probe.yml"

jobs:
  plateau-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Validate model and probe helpers
        run: pytest -q

      - name: Run plateau probe
        env:
          PROBE_SEED: ${{ github.event.inputs.seed || '7' }}
        run: python run_plateau_probe.py --seed "$PROBE_SEED" --output results/plateau-probe-seed${PROBE_SEED}

      - name: Print main findings
        env:
          PROBE_SEED: ${{ github.event.inputs.seed || '7' }}
        run: |
          echo "=== plateau model ==="
          cat results/plateau-probe-seed${PROBE_SEED}/plateau_model.json
          echo "=== fine sweep aggregate ==="
          cat results/plateau-probe-seed${PROBE_SEED}/fine_sweep_aggregate.csv
          echo "=== fixed strategy summary ==="
          cat results/plateau-probe-seed${PROBE_SEED}/fixed_strategy_summary.csv

      - name: Upload plateau probe results
        uses: actions/upload-artifact@v4
        with:
          name: r-germ-plateau-probe-seed${{ github.event.inputs.seed || '7' }}
          path: results/plateau-probe-seed${{ github.event.inputs.seed || '7' }}
          retention-days: 90
